<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>重装机兵 - Metal Max</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body id="main-game-page">
    <div id="game-container">
        <canvas id="game-canvas" width="256" height="240"></canvas>
        
        <div id="mobile-controls">
            <div id="dpad">
                <button id="btn-up" class="dpad-btn">↑</button>
                <button id="btn-down" class="dpad-btn">↓</button>
                <button id="btn-left" class="dpad-btn">←</button>
                <button id="btn-right" class="dpad-btn">→</button>
            </div>
            
            <div id="action-buttons">
                <button id="btn-cancel" class="action-btn cancel">X</button>
                <button id="btn-confirm" class="action-btn confirm">A</button>
            </div>
        </div>
    </div>
    
    <script src="js/game.js"></script>
</body>
</html>
