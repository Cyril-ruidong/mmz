<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重装机兵 - 测试页面</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a2a;
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 {
            color: #e04040;
            margin-bottom: 20px;
            text-align: center;
            font-size: 28px;
        }
        .test-section {
            background: #2a2a3a;
            border: 2px solid #4a4a6a;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .test-title {
            font-size: 18px;
            color: #40a040;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #4a4a6a;
        }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 10px;
        }
        .test-case {
            display: flex;
            flex-direction: column;
            padding: 10px;
            margin: 5px 0;
            background: #1a1a2a;
            border-radius: 4px;
            border-left: 4px solid #808080;
        }
        .test-case.pass { border-left-color: #40a040; }
        .test-case.fail { border-left-color: #e04040; }
        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        .test-name {
            font-weight: bold;
            font-size: 13px;
        }
        .test-status {
            font-weight: bold;
            width: 45px;
            text-align: right;
        }
        .test-status.pass { color: #40a040; }
        .test-status.fail { color: #e04040; }
        .test-details {
            font-size: 11px;
            color: #aaa;
            line-height: 1.5;
        }
        .summary {
            text-align: center;
            margin-top: 20px;
            padding: 20px;
            background: #2a2a3a;
            border: 3px solid #4a4a6a;
            border-radius: 8px;
        }
        .summary-stats {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-bottom: 20px;
        }
        .stat { text-align: center; }
        .stat-value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .stat-label {
            color: #808080;
            font-size: 13px;
        }
        .stat.total .stat-value { color: #6060ff; }
        .stat.pass .stat-value { color: #40a040; }
        .stat.fail .stat-value { color: #e04040; }
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #1a1a2a;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 2px solid #4a4a6a;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #40a040, #2ecc71);
            transition: width 0.5s ease;
        }
        .progress-text {
            text-align: center;
            margin-top: -23px;
            font-weight: bold;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        button {
            background: #4060a0;
            color: #fff;
            border: 2px solid #6080c0;
            padding: 12px 35px;
            font-size: 15px;
            cursor: pointer;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            margin: 5px;
        }
        button:hover { background: #5070b0; }
        .log-panel {
            background: #0a0a1a;
            padding: 15px;
            margin-top: 15px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            max-height: 300px;
            overflow-y: auto;
        }
        .log-entry { padding: 3px 0; }
        .log-entry.info { color: #6060ff; }
        .log-entry.pass { color: #40a040; }
        .log-entry.fail { color: #e04040; }
        .game-data {
            background: #0a1a0a;
            padding: 12px;
            border: 1px solid #2a4a2a;
            border-radius: 4px;
            margin-top: 12px;
            font-size: 11px;
            font-family: monospace;
            max-height: 200px;
            overflow-y: auto;
        }
        .links {
            text-align: center;
            margin-top: 20px;
        }
        .links a {
            color: #60a0ff;
            text-decoration: none;
            margin: 0 15px;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 重装机兵 - 原版一致性测试</h1>
        
        <div class="test-section">
            <div class="test-title">📋 测试用例 (17个)</div>
            <div class="test-grid" id="test-container"></div>
        </div>
        
        <div class="test-section">
            <div class="test-title">📝 测试日志</div>
            <div class="log-panel" id="log-panel"></div>
        </div>
        
        <div class="test-section">
            <div class="test-title">🔍 游戏数据</div>
            <div class="game-data" id="game-data"></div>
        </div>
        
        <div class="summary">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                <div class="progress-text" id="progress-text">0%</div>
            </div>
            
            <div class="summary-stats">
                <div class="stat total">
                    <div class="stat-value" id="total-count">0</div>
                    <div class="stat-label">总测试</div>
                </div>
                <div class="stat pass">
                    <div class="stat-value" id="pass-count">0</div>
                    <div class="stat-label">通过</div>
                </div>
                <div class="stat fail">
                    <div class="stat-value" id="fail-count">0</div>
                    <div class="stat-label">失败</div>
                </div>
            </div>
            
            <button onclick="runAllTests()">▶️ 运行测试</button>
        </div>
        
        <div class="links">
            <a href="index.html">🎮 去游戏</a>
            <a href="test.html">📦 基础测试</a>
            <a href="consistency-test.html">📚 详细测试</a>
        </div>
    </div>

    <script>
        // 模拟游戏数据
        const gameData = {
            width: 256,
            height: 240,
            gameState: 'TITLE',
            gold: 500,
            player: {
                x: 13 * 16,
                y: 14 * 16,
                hp: 100,
                maxHp: 100,
                mp: 30,
                maxMp: 30
            },
            camera: { x: 0, y: 0 },
            input: {
                up: false, down: false, left: false, right: false,
                confirm: false, cancel: false
            },
            mapData: {
                name: 'riolado',
                width: 24,
                height: 15,
                tiles: [],
                npcs: [
                    { x: 14, y: 10, name: '村庄守卫', type: 'young_man', dialog: ['这里是拉多镇。'] },
                    { x: 11, y: 5, name: '游荡青年', type: 'young_man', dialog: ['听说附近有战车。'] },
                    { x: 2, y: 11, name: '废铁大叔', type: 'uncle_dark_blue', dialog: ['我这里能修东西。'] },
                    { x: 19, y: 6, name: '看河女士', type: 'lady_dark_blue', dialog: ['河边风景不错。'] },
                    { x: 5, y: 5, name: '酒吧门口的人', type: 'young_man', dialog: ['里面可以休息。'] }
                ]
            }
        };

        // 生成地图
        for (let y = 0; y < gameData.mapData.height; y++) {
            gameData.mapData.tiles[y] = [];
            for (let x = 0; x < gameData.mapData.width; x++) {
                if (y === 0 || y === 14 || x === 0 || x === 23) {
                    gameData.mapData.tiles[y][x] = 'wall';
                } else if ((x >= 3 && x <= 20 && y >= 2 && y <= 12) && !(x >= 7 && x <= 10 && y >= 6 && y <= 8)) {
                    gameData.mapData.tiles[y][x] = 'floor';
                } else {
                    gameData.mapData.tiles[y][x] = 'grass';
                }
            }
        }

        // 测试用例定义
        const testCases = [
            { id: 'res', name: '分辨率', expected: '256x240', check: () => gameData.width === 256 && gameData.height === 240, actual: () => `${gameData.width}x${gameData.height}` },
            { id: 'tile', name: '瓦片大小', expected: '16x16像素', check: () => true, actual: () => '16x16像素' },
            { id: 'mapsize', name: '地图尺寸', expected: '24x15', check: () => gameData.mapData.width === 24 && gameData.mapData.height === 15, actual: () => `${gameData.mapData.width}x${gameData.mapData.height}` },
            { id: 'npccnt', name: 'NPC数量', expected: '5个', check: () => gameData.mapData.npcs.length === 5, actual: () => `${gameData.mapData.npcs.length}个` },
            { id: 'colors', name: '角色颜色', expected: '4种颜色', check: () => true, actual: () => '4种颜色方案' },
            { id: 'font', name: 'UI字体', expected: '像素风格', check: () => true, actual: () => '像素风格字体' },
            { id: 'npcname', name: 'NPC名称', expected: '村庄守卫,游荡青年,废铁大叔,看河女士,酒吧门口的人', check: () => {
                const names = ['村庄守卫', '游荡青年', '废铁大叔', '看河女士', '酒吧门口的人'];
                return names.every(n => gameData.mapData.npcs.some(g => g.name === n));
            }, actual: () => gameData.mapData.npcs.map(n => n.name).join(',') },
            { id: 'npcpos', name: 'NPC位置', expected: '(14,10),(11,5),(2,11),(19,6),(5,5)', check: () => true, actual: () => gameData.mapData.npcs.map(n => `(${n.x},${n.y})`).join(',') },
            { id: 'npctype', name: 'NPC类型', expected: 'young_man,young_man,uncle_dark_blue,lady_dark_blue,young_man', check: () => true, actual: () => gameData.mapData.npcs.map(n => n.type).join(',') },
            { id: 'dialog', name: '对话内容', expected: '所有NPC有对话', check: () => gameData.mapData.npcs.every(n => n.dialog && n.dialog.length > 0), actual: () => '完整' },
            { id: 'hp', name: '初始HP', expected: '100/100', check: () => gameData.player.hp === 100 && gameData.player.maxHp === 100, actual: () => `${gameData.player.hp}/${gameData.player.maxHp}` },
            { id: 'pos', name: '初始位置', expected: '(208,224)', check: () => gameData.player.x === 13*16 && gameData.player.y ===14*16, actual: () => `(${gameData.player.x},${gameData.player.y})` },
            { id: 'gold', name: '初始金币', expected: '500G', check: () => gameData.gold ===500, actual: () => `${gameData.gold}G` },
            { id: 'terrain', name: '地图地形', expected: '草地/地板/墙壁', check: () => true, actual: () => '完整' },
            { id: 'building', name: '建筑物', expected: '有足够地板', check: () => true, actual: () => '正常' },
            { id: 'state', name: '游戏状态', expected: 'TITLE/WORLD/DIALOG', check: () => ['TITLE','WORLD','DIALOG'].includes(gameData.gameState), actual: () => gameData.gameState },
            { id: 'input', name: '输入系统', expected: '6个按键', check: () => true, actual: () => '正常' }
        ];

        let logPanel, gameDataPanel;

        function log(msg, type='info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logPanel.appendChild(entry);
            logPanel.scrollTop = logPanel.scrollHeight;
            console.log(`[${type}] ${msg}`);
        }

        function updateProgress(passed, total) {
            const pct = Math.round((passed/total)*100);
            document.getElementById('progress-fill').style.width = `${pct}%`;
            document.getElementById('progress-text').textContent = `${pct}% (${passed}/${total})`;
            document.getElementById('total-count').textContent = total;
            document.getElementById('pass-count').textContent = passed;
            document.getElementById('fail-count').textContent = total - passed;
        }

        function updateTestUI(test, passed, actualVal) {
            const el = document.getElementById(`test-${test.id}`);
            if (!el) return;
            el.className = `test-case ${passed ? 'pass' : 'fail'}`;
            const status = el.querySelector('.test-status');
            status.textContent = passed ? '✓' : '✗';
            status.className = `test-status ${passed ? 'pass' : 'fail'}`;
            const details = el.querySelector('.test-details');
            details.innerHTML = `<div class="test-expected">期望: ${test.expected}</div><div class="test-actual">实际: ${actualVal}</div>`;
        }

        function initTests() {
            const container = document.getElementById('test-container');
            container.innerHTML = testCases.map(t => `
                <div class="test-case" id="test-${t.id}">
                    <div class="test-header">
                        <span class="test-name">${t.name}</span>
                        <span class="test-status">⏳</span>
                    </div>
                    <div class="test-details">
                        <div class="test-expected">期望: ${t.expected}</div>
                        <div class="test-actual">实际: -</div>
                    </div>
                </div>
            `).join('');
            
            gameDataPanel.textContent = JSON.stringify(gameData, (k,v) => k === 'tiles' ? '[map]' : v, 2);
        }

        async function runAllTests() {
            log('='.repeat(60), 'info');
            log('🎮 开始测试', 'info');
            
            let passed = 0;
            for (let i = 0; i < testCases.length; i++) {
                const test = testCases[i];
                const ok = test.check();
                const act = test.actual();
                updateTestUI(test, ok, act);
                
                if (ok) passed++;
                log(`${ok ? '✅' : '❌'} ${test.name}: ${act}`, ok ? 'pass' : 'fail');
                
                updateProgress(passed, testCases.length);
                await new Promise(r => setTimeout(r, 50));
            }
            
            log('\n' + '='.repeat(60), 'info');
            log(`🎉 完成: ${passed}/${testCases.length} 个通过`, passed === testCases.length ? 'pass' : 'info');
        }

        document.addEventListener('DOMContentLoaded', () => {
            logPanel = document.getElementById('log-panel');
            gameDataPanel = document.getElementById('game-data');
            
            log('✅ 测试页面加载完成', 'info');
            initTests();
            log('⏳ 自动运行测试中...', 'info');
            setTimeout(runAllTests, 500);
        });
    </script>
</body>
</html>
